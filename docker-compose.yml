# ============================================
# Docker Compose - Pilih salah satu profil
# ============================================
# Supabase (direkomendasi):  docker compose --profile supabase up -d
# SQLite (lokal/offline):     docker compose --profile sqlite up -d
# ============================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - IMGBB_API_KEY=${IMGBB_API_KEY:-}
    restart: unless-stopped

volumes:
  db-data:
